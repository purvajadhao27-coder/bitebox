    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.8), transparent 25%),
                radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.7), transparent 25%),
                linear-gradient(135deg, #f8dce7, #e4d9f8, #d8ecf7);
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            background: rgba(255, 182, 193, 0.35);
            border-radius: 50%;
            top: -100px;
            left: -80px;
            filter: blur(10px);
        }

        body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(180, 160, 255, 0.3);
            border-radius: 50%;
            bottom: -120px;
            right: -80px;
            filter: blur(10px);
        }

        .login-box {
            position: relative;
            z-index: 1;
            width: 390px;
            background: rgba(255, 255, 255, 0.5);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 25px 50px rgba(100, 80, 120, 0.18),
                inset 0 1px 1px rgba(255, 255, 255, 0.8);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #633b82;
            font-size: 30px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #51445a;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid rgba(150, 130, 160, 0.25);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.72);
            color: #444;
            transition: 0.3s ease;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .form-group input:focus {
            border-color: #b78bd0;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 4px rgba(183, 139, 208, 0.12);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        .eye-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            user-select: none;
            opacity: 0.7;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
        }

        .remember input {
            accent-color: #9b6bb5;
            cursor: pointer;
        }

        .forgot {
            text-decoration: none;
            color: #8c5ca8;
            font-weight: 600;
            transition: 0.3s;
        }

        .forgot:hover {
            color: #633b82;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #b784d7, #8e62b0);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(126, 82, 158, 0.25);
            transition: 0.3s ease;
        }

        .login-button:hover {
            background: linear-gradient(135deg, #a66bc9, #7d519f);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(126, 82, 158, 0.35);
        }

        .register {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #777;
        }

        .register a {
            text-decoration: none;
            color: #8c5ca8;
            font-weight: bold;
            transition: 0.3s;
        }

        .register a:hover {
            color: #633b82;
        }
    </style>

</head>

<body>

    <script>
        function togglePassword() {
            let password = document.getElementById("password");
            let eyeIcon = document.getElementById("eyeIcon");

            if (password.type === "password") {
                password.type = "text";
                eyeIcon.innerHTML = "🙈";
            } else {
                password.type = "password";
                eyeIcon.innerHTML = "👁️";
            }
        }
    </script>

    <div class="login-box">

        <h2>BiteBox Login</h2>

        <p class="subtitle">
            Welcome back! Please login to your account.
        </p>

        <!-- // form // -->

        <form onsubmit="login(event)">

            <div class="form-group">

                <label for="Name">
                    Name

                </label>

                <input type="text" id="fullname" placeholder="purva jadhao">
            </div>


            <div class="form-group">

                <label for="email">
                    Email / Mobile No.
                </label>

                <input type="text" id="email" name="email" placeholder="purva@gmail.com" required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input type="password" id="password" name="password" placeholder="Enter Password" minlength="5"
                        maxlength="15" required>

                    <span class="eye-icon" id="eyeIcon" onclick="togglePassword()">
                        👁️
                    </span>

                </div>

            </div>

            <div class="remember-forgot">

                <div class="remember">

                    <input type="checkbox" id="remember" name="remember">

                    <label for="remember">
                        Remember Me
                    </label>

                </div>

                <a href="#" class="forgot">
                    Forgot Password?
                </a>

            </div>

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <p class="register">

            Don't have an account?

            <a href="signuppage.html">
                Register
            </a>

        </p>

    </div>

</body>

</html>
